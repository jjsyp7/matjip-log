<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>맛집 로그</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef2f1; --panel:#ffffff; --ink:#16212b; --sub:#566572; --line:#d3dcdb;
  --accent:#24508f;
  --good:#1f7a4d; --good-soft:#dcf0e5; --warn:#a86400; --warn-soft:#fbecd0; --bad:#b3362b; --bad-soft:#f8dedb; --none:#7b8791;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.55;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);grid-template-rows:100%}
#side{display:flex;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--line)}
#map{min-height:0}
@media (max-width:760px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:46% 54%}
  #map{grid-row:1} #side{grid-row:2;border-right:0;border-top:1px solid var(--line)}
}
.top{padding:14px 16px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.top h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;margin:0}
.rowc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.05em;width:100%}
.chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--sub);margin:0}
#rows{overflow-y:auto;padding:12px 12px 28px;display:flex;flex-direction:column;gap:9px;min-height:0;flex:1}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center}
.row[aria-expanded="true"]{border-color:var(--accent)}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px}
.bg-good{background:var(--good)} .bg-warn{background:var(--warn)} .bg-bad{background:var(--bad)} .bg-none{background:var(--none)}
.row h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0;line-height:1.2}
.meta{font-size:12.5px;color:var(--sub);margin:1px 0 0}
.sum{font-size:13.5px;margin:4px 0 0}
.score{text-align:right;font-variant-numeric:tabular-nums}
.score b{font-family:var(--display);font-weight:400;font-size:25px;line-height:1;display:block}
.score span{font-size:11px;color:var(--sub)}
.flag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 6px;margin:5px 5px 0 0}
.f-bad{background:var(--bad-soft);color:var(--bad)} .f-good{background:var(--good-soft);color:var(--good)} .f-warn{background:var(--warn-soft);color:var(--warn)} .f-info{background:#e2eaf6;color:var(--accent)}
.detail{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;margin-top:-3px}
.detail h3{font-size:12px;letter-spacing:.05em;color:var(--sub);margin:0 0 6px;font-weight:600}
.axis{display:grid;grid-template-columns:82px 56px minmax(0,1fr);gap:9px;align-items:baseline;font-size:13.5px;margin-bottom:6px}
.axis .nm{font-weight:600}
.axis .nm.pri::after{content:" ★";color:var(--accent)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;align-self:center}
.meter i{display:block;height:100%}
.note{color:var(--sub);font-size:13px;margin:0}
.layer{border-top:1px solid var(--line);padding-top:11px}
.yt{margin:0 0 8px}.yt .who{font-weight:600}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:3px 0;font-size:13.5px}
.cnt{font-size:12px;color:var(--sub);white-space:nowrap}
a{color:var(--accent)}
.go{display:inline-block;border:1px solid var(--accent);border-radius:8px;padding:6px 13px;text-decoration:none;font-weight:600;font-size:14px}
.evid{font-size:12px;color:var(--sub);margin:9px 0 0}
.grp{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.05em;margin:8px 2px 0}
.grp:first-child{margin-top:0}
.pinicon.dot{font-size:11.5px}
.empty{color:var(--sub);text-align:center;padding:30px 10px}
.gone{border:1px dashed var(--line);border-radius:10px;padding:9px 12px;color:var(--sub)}
.gone b{font-weight:600;color:var(--ink);text-decoration:line-through;text-decoration-color:var(--sub)}
.gone p{margin:1px 0 0;font-size:12.5px}
.pinicon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 13px var(--body);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.pinicon.on{width:38px;height:38px;font-size:15px;margin:-4px 0 0 -4px}
.leaflet-tooltip{font-family:var(--body);font-weight:600}
</style>
</head>
<body>
<aside id="side">
  <div class="top">
    <h1>맛집 로그</h1>
    <div class="rowc"><span class="lab">내가 중요하게 보는 것</span><span id="axisChips" class="rowc"></span></div>
    <div class="rowc"><span class="lab">종류</span><span id="cuisineChips" class="rowc"></span></div>
    <div class="rowc" id="menuRow"><span class="lab">메뉴</span><span id="menuChips" class="rowc"></span></div>
    <div class="rowc"><span class="lab">나라</span><span id="countryChips" class="rowc"></span></div>
    <div class="rowc"><span class="lab">지역</span><span id="regionChips" class="rowc"></span></div>
    <p class="hint" id="hint"></p>
  </div>
  <div id="rows"><p class="empty">가게 목록을 불러오는 중입니다.</p></div>
</aside>
<div id="map" aria-label="가게 지도"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const AXES=[["taste","맛"],["service","서비스"],["value","가성비"],["wait","웨이팅·예약"],["mood","분위기·청결"],["access","접근성"]];
const AXN=Object.fromEntries(AXES);
let places=[], closed=[], pri=new Set(), country="전체", region="전체", cuisine="전체", menu="전체", openId=null, markers={}, fitKey="";
try{ const s=JSON.parse(localStorage.getItem("jjin")||"{}"); pri=new Set(s.pri||[]); region=s.region||"전체"; country=s.country||"전체"; cuisine=s.cuisine||"전체"; menu=s.menu||"전체"; }catch(e){}
const save=()=>{ try{ localStorage.setItem("jjin",JSON.stringify({pri:[...pri],region,country,cuisine,menu})); }catch(e){} };

const map=L.map("map",{zoomControl:true}).setView([36.3,127.8],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

function el(tag,attrs,...kids){ const n=document.createElement(tag); if(attrs) for(const k in attrs){ if(k==="class") n.className=attrs[k]; else if(k==="text") n.textContent=attrs[k]; else n.setAttribute(k,attrs[k]); } for(const c of kids){ if(c==null) continue; n.append(c.nodeType?c:document.createTextNode(String(c))); } return n; }
const safeUrl=u=>typeof u==="string"&&/^https:\/\//.test(u)?u:null;
const num=v=>typeof v==="number"&&isFinite(v)?v:null;
const gcls=g=>/비추|아쉬움/.test(g||"")?"f-bad":/추천|극찬|호평/.test(g||"")?"f-good":"f-warn";

// 카카오로 확인할 수 없는 가게는 맛 점수를 낮춰 같은 줄에 세운다. 믿을 평점이 하나도 없을 때만(unranked) 순위에서 뺀다
const hidden=p=>!!p.unranked;
// 식중독 기준: 1년 안 3건 이상이면 제외(믿는 유튜버 추천이 있으면 5건), 날것 가게는 2년 안 2건. 그 아래는 healthNote로 참고만
const poisoned=p=>!!p.poison;
// 분위기용 묶음은 분위기·서비스에 2배, 맛은 1배로 본다
function score(p,occ){
  let w=0,t=0; const weak=[], strong=[];
  for(const [k] of AXES){ if(k==="wait") continue; const s=num(p.axes&&p.axes[k]&&p.axes[k].s); if(s==null) continue; const wt=pri.has(k)?3:(!pri.size&&(occ?(k==="mood"||k==="service"):k==="taste")?2:1); w+=wt; t+=wt*s; if(pri.has(k)){ if(s<=2.5) weak.push(k); else if(s>=4.5) strong.push(k);} }
  if(!w) return {v:null,tier:"none",weak,strong};
  let v=Math.round((t/w-1)/4*100);
  if(weak.length) v=Math.max(0,v-8*weak.length);
  const hid=hidden(p);
  const ban=poisoned(p);
  const tier=ban?"bad":hid?"none":weak.length?"bad":v>=72?"good":v>=52?"warn":"bad";
  return {v,tier,weak,strong,hid,ban};
}
// 단일 메뉴를 늘어놓지 않고 종류 안에서 큰 묶음으로 보여 준다(묶음에 없는 메뉴는 그대로)
const MENU_GROUPS={
 "한식":{"국밥·탕":["국밥·곰탕","돼지국밥","설렁탕","순대국","내장탕","도가니탕","감자탕·뼈해장국","돼지곰탕","순두부","청국장","어복쟁반"],
  "냉면·막국수":["냉면","막국수","메밀국수"],"칼국수·국수":["칼국수","수제비","칼국수·수제비","콩국수","냄비국수","잔치국수","쌀국수"],
  "고기":["고기구이","불고기","떡갈비","돼지갈비","삼겹살","한우","닭갈비","닭요리","흑염소","무한리필","육회","샤브샤브"],
  "만두":["만두","만둣국","만두·만둣국"],"족발·수육·순대":["족발","제육·수육","수육","순대","오징어순대"],
  "한정식·백반":["한정식·궁중음식","다과상","비빔밥","두부","전"],"해산물":["간장게장"],"분식":["분식·떡볶이"]},
 "일식":{"라멘":["라멘"],"스시·회":["참치회","연어","사시미","스시","오마카세","초밥","카이센동"],
  "덮밥":["덮밥","장어덮밥","텐동","규동","토리동","히츠마부시","가마메시"],"튀김·돈카츠":["돈가스","돈카츠","덴푸라"],
  "구이·꼬치":["야키토리","로바타야키","야키니쿠","생선구이","스키야키","몬자야키","함바그"],"우동·소바":["우동","메밀국수"],"코스":["코스 요리","일식 코스"]},
 "중식":{"요리":["중식 요리","홍콩 요리","북경오리","코스 요리","중화요리","양꼬치"],"만두·딤섬":["만두","딤섬"],"면":["우육면","짜장면","라멘"],"볶음밥":["볶음밥"]}};
const MG={}; for(const c in MENU_GROUPS){ MG[c]={}; for(const g in MENU_GROUPS[c]) MENU_GROUPS[c][g].forEach(m=>MG[c][m]=g); }
const groupsOf=p=>[...new Set((p.menus||[]).map(m=>(MG[p.cuisine]&&MG[p.cuisine][m])||m))];
// 해외는 나라를 고르면 지역을 나누지 않고 점수순으로 줄을 세운다
const flat=()=>region!=="전체"||(country!=="전체"&&country!=="한국");
// 이 점수에 못 미치는 가게는 목록과 지도에서 숨긴다(가지 말 것·순위 제외 묶음은 그대로 둠)
const MIN_SCORE=50; let hiddenLow=0;
// 지역을 고르면 그 안에서 순위를 매기고, 전체에서는 순위 없이 지역별로 묶는다
const ranked=()=>{ hiddenLow=0; const l=places.filter(p=>(cuisine==="전체"||p.cuisine===cuisine)&&(menu==="전체"||groupsOf(p).includes(menu))&&(country==="전체"||(p.country||"한국")===country)&&(region==="전체"||p.region===region)).map(p=>({p,sc:score(p)})).filter(x=>{ const low=!x.sc.ban&&!x.sc.hid&&x.sc.v!=null&&x.sc.v<MIN_SCORE; if(low) hiddenLow++; return !low; }).sort((a,b)=>(b.sc.v??-1)-(a.sc.v??-1));
  const ex=x=>x.sc.ban?2:x.sc.hid?1:x.occ?0.5:0;
  l.sort((a,b)=>ex(a)-ex(b));
  if(!flat()){ const cnt={}; l.forEach(x=>cnt[x.p.region]=(cnt[x.p.region]||0)+1); l.sort((a,b)=>(cnt[b.p.region]-cnt[a.p.region])||String(a.p.region).localeCompare(String(b.p.region))||(ex(a)-ex(b))||((b.sc.v??-1)-(a.sc.v??-1))); }
  return l; };

function renderChips(){
  const ax=document.getElementById("axisChips"); ax.replaceChildren();
  pri.delete("wait"); for(const [k,n] of AXES){ if(k==="wait") continue; const b=el("button",{class:"chip",type:"button","aria-pressed":String(pri.has(k)),text:n}); b.onclick=()=>{ pri.has(k)?pri.delete(k):pri.add(k); save(); render(); }; ax.append(b); }
  const CO=["한식","일식","중식","양식"];
  const cu=document.getElementById("cuisineChips"); cu.replaceChildren();
  const cus=["전체",...[...new Set(places.map(p=>p.cuisine).filter(Boolean))].sort((a,b)=>(CO.indexOf(a)<0?9:CO.indexOf(a))-(CO.indexOf(b)<0?9:CO.indexOf(b))||a.localeCompare(b))];
  if(!cus.includes(cuisine)) cuisine="전체";
  for(const c of cus){ const b=el("button",{class:"chip",type:"button","aria-pressed":String(cuisine===c),text:c}); b.onclick=()=>{ cuisine=c; menu="전체"; openId=null; save(); render(); }; cu.append(b); }
  const mr=document.getElementById("menuRow"), mc=document.getElementById("menuChips"); mc.replaceChildren();
  mr.style.display=cuisine==="전체"?"none":"";
  if(cuisine!=="전체"){ const cnt={}; places.filter(p=>p.cuisine===cuisine).forEach(p=>groupsOf(p).forEach(m=>cnt[m]=(cnt[m]||0)+1));
    const ms=["전체",...Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b))]; if(!ms.includes(menu)) menu="전체";
    for(const m of ms){ const b=el("button",{class:"chip",type:"button","aria-pressed":String(menu===m),text:m==="전체"?m:`${m} ${cnt[m]}`}); b.onclick=()=>{ menu=m; openId=null; save(); render(); }; mc.append(b); } }
  const cg=document.getElementById("countryChips"); cg.replaceChildren();
  const cs=["전체",...[...new Set(places.map(p=>p.country||"한국"))].sort()];
  if(!cs.includes(country)) country="전체";
  for(const c of cs){ const b=el("button",{class:"chip",type:"button","aria-pressed":String(country===c),text:c}); b.onclick=()=>{ country=c; region="전체"; openId=null; save(); render(); }; cg.append(b); }
  const rg=document.getElementById("regionChips"); rg.replaceChildren();
  const regs=["전체",...[...new Set(places.filter(p=>country==="전체"||(p.country||"한국")===country).map(p=>p.region).filter(Boolean))].sort()];
  if(!regs.includes(region)) region="전체";
  for(const r of regs){ const b=el("button",{class:"chip",type:"button","aria-pressed":String(region===r),text:r}); b.onclick=()=>{ region=r; openId=null; save(); render(); }; rg.append(b); }
  document.getElementById("hint").textContent=pri.size?`${[...pri].map(k=>AXN[k]).join(", ")}에 3배 가중치. 이 항목이 약한 가게는 점수가 깎이고 경고가 붙습니다. 웨이팅은 점수에 넣지 않습니다.`:"고르지 않으면 맛을 2배로, 나머지 네 항목은 똑같이 봅니다. 웨이팅은 점수에 넣지 않고 정보로만 보여줍니다.";
  document.getElementById("hint").textContent+=!flat()?" 지역을 고르면 그 안에서 순위가 매겨집니다.":"";
}

function renderMap(list){
  Object.values(markers).forEach(m=>m.remove()); markers={};
  const pts=[];
  list.forEach((x,i)=>{ const {p,sc}=x; if(num(p.lat)==null||num(p.lng)==null||(x.occ&&p.occasionAlso)) return; const on=openId===p.id;
    const icon=L.divIcon({className:"",html:`<div class="pinicon bg-${sc.tier}${on?" on":""}${!flat()?" dot":""}">${sc.ban?"✕":sc.hid?"?":x.occ?"뷰":!flat()?(sc.v??"–"):i+1}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
    const m=L.marker([p.lat,p.lng],{icon,zIndexOffset:on?1000:0,title:p.name}).addTo(map);
    m.bindTooltip(p.name,{direction:"top",offset:[0,-14]});
    m.on("click",()=>{ openId=on?null:p.id; render(); const r=document.getElementById("row-"+p.id); r&&r.scrollIntoView({block:"nearest",behavior:"smooth"}); });
    markers[p.id]=m; pts.push([p.lat,p.lng]); });
  const key=country+"|"+region+"|"+cuisine+"|"+menu+"|"+pts.length;
  if(pts.length&&key!==fitKey){ fitKey=key; map.fitBounds(pts,{padding:[50,50],maxZoom:15}); }
}

function detail(p){
  const d=el("div",{class:"detail"});
  const ax=el("div",null,el("h3",{text:"항목별 평가"}));
  for(const [k,n] of AXES){ const a=(p.axes&&p.axes[k])||{}; const s=num(a.s);
    if(k==="wait"){ ax.append(el("div",{class:"axis"},el("span",{class:"nm",text:"대기 정보"}),el("span",{class:"cnt",text:"점수 제외"}),el("span",{class:"note",text:a.n||"정보 없음"}))); continue; }
    const m=el("div",{class:"meter"}); if(s!=null){ const i=el("i",{class:s>=4?"bg-good":s>=3?"bg-warn":"bg-bad"}); i.style.width=(s/5*100)+"%"; m.append(i); }
    ax.append(el("div",{class:"axis"},el("span",{class:"nm"+(pri.has(k)?" pri":""),text:n}),m,el("span",{class:"note",text:s==null?(a.kwk||"근거 없음"):(a.n||"")+(a.fo?` ⚠ ${a.fo}`:"")+(a.kwk?` [${a.kwk}]`:"")+(a.kw?` [${a.kw}${a.auto?"":a.fo?"":" · 언급이 적어 점수에는 미반영"}]`:"")})));
  }
  if(p.tasteBasis) ax.append(el("p",{class:"evid",style:"margin-top:2px",text:"맛 점수 근거: "+p.tasteBasis}));
  d.append(ax);
  if(p.poison){ const b=el("div",{class:"layer",style:"border-top:0;padding-top:0"},el("h3",{text:"가지 않는 이유",style:"color:var(--bad)"})); b.append(el("p",{class:"note",text:p.poison})); d.prepend(b); }
  if(p.healthNote&&!p.poison){ const b=el("div",{class:"layer",style:"border-top:0;padding-top:0"},el("h3",{text:"배탈·식중독 주장 (참고)"})); b.append(el("p",{class:"note",text:p.healthNote})); d.prepend(b); }
  const l1=el("div",{class:"layer"},el("h3",{text:"1층 · 대중 평점"}));
  const rs=Array.isArray(p.ratings)?p.ratings:[];
  if(!rs.length) l1.append(el("p",{class:"note",text:"아직 조사하지 않았습니다."}));
  for(const g of rs){ const head=(num(g.rating)!=null?`${g.src} ${g.rating}점`:`${g.src} 별점 없음`)+(g.distrust?" (리뷰 이벤트 의심 · 참고 안 함)":""); const tail=(num(g.count)!=null?` · ${g.count.toLocaleString()}개`:"")+(num(g.lowPct)!=null?` · 1~2점 ${g.lowPct}%`:""); l1.append(el("p",{class:"yt"},el("span",{class:"who",text:head}),tail)); if(g.note) l1.append(el("p",{class:"note",style:"margin:-4px 0 9px",text:g.note})); }
  d.append(l1);
  const l2=el("div",{class:"layer"},el("h3",{text:"2층 · 믿는 유튜버"}));
  if(Array.isArray(p.youtubers)&&p.youtubers.length){ for(const y of p.youtubers){ const row=el("p",{class:"yt"},el("span",{class:"who",text:y.who||"유튜버"})," ",el("span",{class:"flag "+gcls(y.grade),text:y.grade||"평가"}),el("br"),"“"+(y.quote||"")+"”"); const u=safeUrl(y.url); if(u) row.append(" ",el("a",{href:u,target:"_blank",rel:"noopener",text:"영상에서 보기"})); l2.append(row); if(Array.isArray(y.points)&&y.points.length){ const ul=el("ul",{class:"plain",style:"margin-bottom:10px"}); y.points.forEach(t=>ul.append(el("li",{text:t}))); l2.append(ul); } } }
  else l2.append(el("p",{class:"note",text:"이 가게를 다룬 영상을 아직 찾지 않았습니다."}));
  d.append(l2);
  const l3=el("div",{class:"layer"},el("h3",{text:"3층 · 방문자가 반복해서 말한 불만"}));
  if(Array.isArray(p.complaints)&&p.complaints.length){ const ul=el("ul",{class:"plain"}); for(const c of p.complaints){ ul.append(el("li",null,el("b",{text:(AXN[c.axis]||"기타")+" "}),c.text||""," ",el("span",{class:"cnt",text:[c.n?`약 ${c.n}건${c.approx?"(기간 밖 포함)":""}`:null,c.when].filter(Boolean).join(" · ")}))); } l3.append(ul); }
  else l3.append(el("p",{class:"note",text:"저평점 리뷰를 아직 읽지 않았습니다."}));
  if(Array.isArray(p.praise)&&p.praise.length){ l3.append(el("h3",{text:"방문자가 반복해서 칭찬한 것",style:"margin-top:12px"})); const ul=el("ul",{class:"plain"}); p.praise.forEach(t=>ul.append(el("li",{text:t}))); l3.append(ul); }
  if(p.kr){ l3.append(el("h3",{text:"한국인 입맛 기준",style:"margin-top:12px"})); l3.append(el("p",{class:"note",text:p.kr})); }
  if(p.recent){ l3.append(el("h3",{text:"최근 분위기",style:"margin-top:12px"})); l3.append(el("p",{class:"note",text:p.recent})); }
  d.append(l3);
  if(Array.isArray(p.tips)&&p.tips.length){ const t=el("div",{class:"layer"},el("h3",{text:"가기 전에"})); const ul=el("ul",{class:"plain"}); p.tips.forEach(x=>ul.append(el("li",{text:x}))); t.append(ul); d.append(t); }
  const foot=el("div",{class:"layer"}); const gm=safeUrl(p.gmaps); if(gm) foot.append(el("a",{class:"go",href:gm,target:"_blank",rel:"noopener",text:"구글 지도에서 열기"}));
  foot.append(el("p",{class:"evid",text:`근거: ${p.evidence||"미기재"}${p.checked?` · 확인일 ${p.checked}`:""}`})); if(p.repass) foot.append(el("p",{class:"evid",style:"margin-top:2px",text:p.repass}));
  if(p.window) foot.append(el("p",{class:"evid",style:"margin-top:2px",text:p.window}));
  d.append(foot);
  return d;
}

function render(){
  renderChips();
  const list=ranked(); renderMap(list);
  const rows=document.getElementById("rows"); rows.replaceChildren();
  const gone=closed.filter(c=>(country==="전체"||(c.country||"한국")===country)&&(region==="전체"||c.region===region)&&(cuisine==="전체"||c.cuisine===cuisine));
  if(!list.length) rows.append(el("p",{class:"empty",text:"이 조건에 맞는 가게가 아직 없습니다."}));
  let grp=null;
  list.forEach((x,i)=>{ const {p,sc}=x; const on=openId===p.id;
    if(!flat()&&p.region!==grp){ grp=p.region; rows.append(el("p",{class:"grp",text:`${grp||"지역 미정"} · ${list.filter(y=>y.p.region===grp).length}곳`})); }
    if(flat()&&x.occ&&!sc.ban&&!sc.hid&&!(list[i-1]&&list[i-1].occ)) rows.append(el("p",{class:"grp",text:"분위기용 · 분위기와 서비스를 더 크게 봄"}));
    if(sc.ban&&!(list[i-1]&&list[i-1].sc.ban&&(flat()||list[i-1].p.region===p.region))) rows.append(el("p",{class:"grp",text:"가지 말 것 · 식중독 주장 반복"}));
    const r=el("button",{class:"row",type:"button",id:"row-"+p.id+(x.occ&&p.occasionAlso?"-occ":""),"aria-expanded":String(on)});
    const mid=el("div",null,el("h2",{text:p.name||"이름 없음"}),el("p",{class:"meta",text:[p.area,[p.cuisine,(p.menus||[]).join("·")].filter(Boolean).join(" › ")||p.category,(p.ratings||[]).filter(r=>num(r.rating)!=null).map(r=>`${r.src} ${r.rating}${r.distrust?"(의심)":""}`).join(" / ")||null].filter(Boolean).join(" · ")}));
    if(p.summary) mid.append(el("p",{class:"sum",text:p.summary}));
    const flags=el("div");
    if(sc.ban) flags.append(el("span",{class:"flag f-bad",text:"✕ 가지 않음 · 식중독 주장 반복"}));
    if(p.healthNote&&!sc.ban) flags.append(el("span",{class:"flag f-warn",text:"배탈 언급 있음 (참고)"}));
    if(sc.hid) flags.append(el("span",{class:"flag f-bad",text:"예외 · 믿을 평점 없음 (순위 제외)"}));
    if(p.noKakao&&!sc.hid) flags.append(el("span",{class:"flag f-warn",text:p.noKakao}));
    if(p.fewReviews) flags.append(el("span",{class:"flag f-warn",text:"후기 적음 · 맛 상한 4.0"}));
    if(p.pest) flags.append(el("span",{class:"flag f-bad",text:p.pest}));
    if(p.tourist&&!p.krPopular) flags.append(el("span",{class:"flag f-warn",text:"관광객 많음"}));
    if(p.krPopular) flags.append(el("span",{class:"flag f-info",text:"한국인에게 인기"}));
    if(p.occasion) flags.append(el("span",{class:"flag f-warn",text:"분위기용"}));
    if(p.caution) flags.append(el("span",{class:"flag f-bad",text:"⚠ "+p.caution}));
    if(p.axes&&p.axes.mood&&p.axes.mood.fo&&/음식 속 이물질|머리카락|그릇에 죽은 벌레/.test(p.axes.mood.fo)) flags.append(el("span",{class:"flag f-bad",text:"음식 이물질 후기"}));
    sc.weak.forEach(k=>flags.append(el("span",{class:"flag f-bad",text:`${AXN[k]} 약함`})));
    sc.strong.forEach(k=>flags.append(el("span",{class:"flag f-good",text:`${AXN[k]} 강함`})));
    (p.youtubers||[]).forEach(y=>flags.append(el("span",{class:"flag "+gcls(y.grade),text:`${y.who} ${y.grade}`})));
    if(flags.childNodes.length) mid.append(flags);
    r.append(el("span",{class:"rank bg-"+sc.tier,text:sc.ban?"✕":sc.hid?"?":x.occ?"뷰":!flat()?"":String(i+1)}),mid,el("div",{class:"score"},el("b",{text:sc.v==null?"–":String(sc.v)}),el("span",{text:"맞춤 점수"})));
    r.onclick=()=>{ openId=on?null:p.id; render(); if(openId&&markers[p.id]) map.panTo(markers[p.id].getLatLng()); };
    rows.append(r); if(on) rows.append(detail(p));
  });
  if(hiddenLow) rows.append(el("p",{class:"evid",text:`${MIN_SCORE}점에 못 미치는 ${hiddenLow}곳은 숨겼습니다.`}));
  // 폐업한 곳은 지도와 순위에서 지우고 이름만 남긴다 (closed.json)
  if(gone.length){ rows.append(el("p",{class:"grp",text:`폐업 · ${gone.length}곳`}));
    gone.forEach(c=>rows.append(el("div",{class:"gone"},el("b",{text:c.name}),el("p",{text:[c.area,c.closedOn&&c.closedOn+" 확인",c.note].filter(Boolean).join(" · ")})))); }
}

fetch("closed.json",{cache:"no-store"}).then(r=>r.ok?r.json():[]).then(d=>{ closed=d; if(places.length) render(); }).catch(()=>{});
fetch("places.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{ places=d; render(); })
  .catch(()=>{ document.getElementById("rows").replaceChildren(el("p",{class:"empty",text:"places.json을 읽지 못했습니다."})); });
</script>
